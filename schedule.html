<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1826">
<title>내 스케줄</title>
<link rel="stylesheet" href="style.css">
<!-- inline-sched-style -->
<style>
/* 스케줄 */
.big-btn.light{background:#fff;color:var(--navy-900);border:1.5px solid var(--line);}
.big-btn.light .bb-ico{background:var(--success-soft);color:var(--success);}
.seg{display:flex;background:#ECEAE2;border-radius:10px;padding:4px;margin-bottom:12px;}
.seg button{flex:1;border:none;background:transparent;padding:9px 4px;font-size:12.5px;font-weight:700;color:var(--muted);border-radius:7px;cursor:pointer;}
.seg button.on{background:var(--navy-900);color:#fff;}
.cal-day.past{background:#F1EFE8;color:#A5A9B6;font-weight:700;}
.sch-card{cursor:pointer;}
.sch-date{font-size:16px;font-weight:800;}
.tag.driver{background:var(--success-soft);color:var(--success);}
.tag.owner{background:var(--amber-soft);color:var(--amber-dark);}
.tag.done{background:#ECEAE2;color:var(--muted);}

.cal-day.asg{background:var(--success);color:#fff;font-weight:800;}
.cal-day.wait{background:var(--amber-soft);color:var(--amber-dark);font-weight:800;}
.sch-card.assigned{border-left:4px solid var(--success);}
.sch-card.waiting{border-left:4px solid var(--amber);}
.tag.assigned{background:var(--success);color:#fff;}
.tag.waiting{background:var(--amber-soft);color:var(--amber-dark);}
</style>
</head>
<body>
<main class="container">
  <div class="seg" id="seg">
    <button type="button" class="on" data-f="all">전체</button>
    <button type="button" data-f="driver">내가 맡은 용차</button>
    <button type="button" data-f="owner">내가 등록한 용차</button>
  </div>

  <div class="card">
    <div id="cal"></div>
    <div class="legend">
      <span><i style="background:var(--success)"></i>배정완료</span>
      <span><i style="background:var(--success-soft)"></i>내가 맡은 용차</span>
      <span><i style="background:var(--amber-soft)"></i>기사 모집중</span>
      <span><i style="background:#F1EFE8"></i>지난 일정</span>
    </div>
  </div>

  <div class="h2" id="listTitle">다가오는 일정</div>
  <div id="list"><div class="empty">불러오는 중...</div></div>
</main>

<script src="common.js"></script>
<script>
  const $ = function(id){ return document.getElementById(id); };
  let all = [], today = todayStr(), filter = 'all', picked = null, cal = null;

  if(requireLogin()){
    renderAppbar({ title: '내 스케줄', back: true });
    window.addEventListener('yc:noti-changed', load);
    $('seg').addEventListener('click', function(e){
      const b = e.target.closest('button[data-f]'); if(!b) return;
      filter = b.dataset.f; picked = null;
      Array.prototype.forEach.call($('seg').children, function(x){ x.classList.toggle('on', x === b); });
      draw(true);
    });
    load();
  }

  async function load(){
    try {
      const r = await api('schedule');
      all = r.items || [];
      if(r.today) today = r.today;
      draw(!cal);
    } catch(e){ $('list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
  }

  function visible(){ return all.filter(function(i){ return filter === 'all' || i.role === filter; }); }

  // 날짜 표시 색: 배정완료(asg) > 내가 맡은 용차(requested) > 기사 모집중(wait), 지난 일정은 past
  function kind(i){ return i.role === 'driver' ? 'requested' : (i.assigned ? 'asg' : 'wait'); }
  const RANK = { past: 0, wait: 1, requested: 2, asg: 3 };

  function dateMap(items){
    const m = {};
    items.forEach(function(i){
      const k = i.date < today ? 'past' : kind(i);
      if(!m[i.date] || RANK[k] > RANK[m[i.date].cls]) m[i.date] = { cls: k };
    });
    return m;
  }

  function draw(rebuildCal){
    const items = visible();
    const map = dateMap(items);
    if(rebuildCal || !cal){
      const old = $('cal'); const fresh = old.cloneNode(false); old.replaceWith(fresh);
      const upcoming = items.filter(function(i){ return i.date >= today; })[0];
      cal = Calendar($('cal'), { mode: 'pick', start: upcoming ? upcoming.date : today, dates: map,
        onPick: function(ds){ picked = (picked === ds) ? null : ds; renderList(); } });
    } else {
      cal.setDates(map);
    }
    renderList();
  }

  function statusTag(i){
    if(i.date < today) return '<span class="tag done">지난 일정</span>';
    if(i.role === 'driver') return '<span class="tag driver">내가 맡은 용차</span>';
    return i.assigned ? '<span class="tag assigned">배정완료</span>' : '<span class="tag waiting">기사 모집중</span>';
  }

  function renderList(){
    const items = visible();
    let rows, title;
    if(picked){
      rows = items.filter(function(i){ return i.date === picked; });
      title = kdate(picked) + ' 일정';
    } else {
      rows = items.filter(function(i){ return i.date >= today; });
      title = '다가오는 일정';
    }
    $('listTitle').textContent = title;
    if(!rows.length){
      $('list').innerHTML = '<div class="empty">' + (picked ? '이 날짜에는 일정이 없습니다.' : '표시할 일정이 없습니다.<br>용차일을 등록하거나 의뢰가 수락되면 여기에 표시됩니다.') + '</div>';
      return;
    }
    $('list').innerHTML = rows.map(function(i){
      const driver = i.role === 'driver';
      const c = i.counterpart || {};
      const cls = driver ? '' : (i.assigned ? ' assigned' : ' waiting');
      let who;
      if(i.assigned){
        who = '<div class="jc-row"><b>' + (driver ? '요청자' : '배정 기사') + '</b><span>@' + esc(c.id) + (c.name ? ' · ' + esc(c.name) : '') + '</span></div>' +
              '<div class="jc-row"><b>연락처</b><span>' + telLink(c.phone) + '</span></div>';
      } else {
        who = '<div class="jc-row"><b>배정 기사</b><span class="muted">' + (i.pending > 0 ? '아직 없음 · 의뢰 ' + i.pending + '건 응답 대기' : '아직 없음 · 의뢰 대기중') + '</span></div>';
      }
      return '<div class="job-card sch-card' + cls + '" data-rid="' + esc(i.rid) + '" data-pending="' + (i.pending || 0) + '">' +
        '<div class="jc-top"><div class="sch-date">' + esc(kdate(i.date)) + '</div>' + statusTag(i) + '</div>' +
        '<div class="jc-row"><b>근무</b><span>' + shiftTag(i.shift) + ' <span class="muted small">PDD 기준</span></span></div>' +
        '<div class="jc-row"><b>캠프</b><span>' + esc(i.camp) + '</span></div>' +
        '<div class="jc-row"><b>라우트</b><span>' + esc(i.route) + '</span></div>' +
        '<div class="jc-row"><b>단가</b><span><strong>' + won(i.price) + '</strong>' + (i.jibun ? ' (지번 포함)' : '') + '</span></div>' +
        who +
        '<div class="jc-row"><b>주차자리</b><span>' + esc(i.parking || '-') + '</span></div>' +
        '</div>';
    }).join('');
  }

  $('list').addEventListener('click', function(e){
    if(e.target.closest('a')) return; // 전화 링크는 그대로 동작
    const c = e.target.closest('.sch-card'); if(!c) return;
    if(c.dataset.rid){ showMatchScreen(c.dataset.rid); }
    else if(Number(c.dataset.pending) > 0){ location.href = 'notifications.html'; }
  });
</script>
</body>
</html>
