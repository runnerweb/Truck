<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용차 매칭 | 로그인</title>
<style>
  :root{
    --navy-900:#0F1826;
    --navy-800:#16223A;
    --navy-700:#1E2E4D;
    --amber:#E8A33D;
    --amber-dark:#C6852A;
    --paper:#F7F6F2;
    --ink:#1C2333;
    --muted:#7A8296;
    --line:#E4E1D8;
    --danger:#C1443D;
    --success:#2F6F5E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    min-height:100vh;
  }

  /* ---------- 좌측 브랜드 패널 ---------- */
  .brand{
    position:relative;
    flex:1 1 46%;
    background:linear-gradient(160deg, var(--navy-900) 0%, var(--navy-700) 100%);
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:56px 48px;
    overflow:hidden;
    min-width:0;
  }
  .brand-top{position:relative;z-index:2;}
  .brand-eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    color:var(--amber);
    font-weight:700;
    margin-bottom:18px;
  }
  .brand-title{
    font-size:34px;
    font-weight:800;
    line-height:1.35;
    letter-spacing:-0.02em;
    margin:0 0 14px;
  }
  .brand-sub{
    font-size:14.5px;
    color:#B9C2D6;
    line-height:1.7;
    max-width:360px;
  }

  /* 노선(route) 시그니처 그래픽 */
  .route-wrap{
    position:relative;
    z-index:2;
    margin-top:40px;
  }
  .route-svg{ width:100%; height:auto; display:block; }
  .route-caption{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#8894AC;
    margin-top:10px;
    letter-spacing:.04em;
  }

  .brand-footer{
    position:relative;
    z-index:2;
    font-size:12px;
    color:#6E7A94;
    display:flex;
    gap:20px;
  }

  /* 배경 은은한 격자 텍스처 */
  .brand::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:34px 34px;
    z-index:1;
  }

  /* ---------- 우측 폼 패널 ---------- */
  .form-panel{
    flex:1 1 54%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
  }
  .form-card{
    width:100%;
    max-width:380px;
  }
  .form-card h1{
    font-size:22px;
    font-weight:800;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .form-card .desc{
    font-size:13.5px;
    color:var(--muted);
    margin:0 0 32px;
  }

  .role-toggle{
    display:flex;
    background:#ECEAE2;
    border-radius:10px;
    padding:4px;
    margin-bottom:24px;
  }
  .role-toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 0;
    font-size:13.5px;
    font-weight:700;
    color:var(--muted);
    border-radius:7px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .role-toggle button.active{
    background:var(--navy-900);
    color:#fff;
  }

  label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 6px;
  }
  .field{ margin-bottom:16px; }
  input[type=text], input[type=password]{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-size:14.5px;
    background:#fff;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  input[type=text]:focus, input[type=password]:focus{
    border-color:var(--amber-dark);
  }

  .btn-primary{
    width:100%;
    padding:13px 0;
    margin-top:8px;
    background:var(--navy-900);
    color:#fff;
    border:none;
    border-radius:9px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s ease, transform .05s ease;
  }
  .btn-primary:hover{ background:var(--navy-700); }
  .btn-primary:active{ transform:translateY(1px); }
  .btn-primary:disabled{ background:#B7BDCB; cursor:not-allowed; }

  .msg{
    margin-top:14px;
    font-size:13px;
    padding:10px 12px;
    border-radius:8px;
    display:none;
  }
  .msg.error{ display:block; background:#FBEAE8; color:var(--danger); }
  .msg.success{ display:block; background:#E9F2EE; color:var(--success); }

  .bottom-link{
    margin-top:22px;
    text-align:center;
    font-size:13px;
    color:var(--muted);
  }
  .bottom-link a{
    color:var(--navy-900);
    font-weight:700;
    text-decoration:none;
  }
  .bottom-link a:hover{ text-decoration:underline; }

  @media (max-width:860px){
    body{ flex-direction:column; }
    .brand{ flex:none; padding:36px 28px; }
    .brand-title{ font-size:26px; }
    .route-wrap{ margin-top:26px; }
    .form-panel{ padding:32px 20px 60px; }
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-top">
      <div class="brand-eyebrow">RUNNER · 용차 매칭</div>
      <h1 class="brand-title">기사와 일거리를<br>가장 빠른 노선으로<br>연결합니다</h1>
      <p class="brand-sub">캠프별 용차 공고 등록, 기사 지원, 스케줄 확정까지<br>하나의 시스템에서 관리하세요.</p>
    </div>

    <div class="route-wrap">
      <svg class="route-svg" viewBox="0 0 420 130" fill="none">
        <path d="M10 100 C 90 100, 90 30, 160 30 S 260 100, 340 100 S 400 40, 410 20"
              stroke="#3A4C74" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round"/>
        <circle cx="10" cy="100" r="5" fill="#E8A33D"/>
        <circle cx="160" cy="30" r="4" fill="#8894AC"/>
        <circle cx="340" cy="100" r="4" fill="#8894AC"/>
        <circle cx="410" cy="20" r="5" fill="#E8A33D"/>
        <text x="4" y="118" fill="#B9C2D6" font-size="10" font-family="sans-serif">출발 캠프</text>
        <text x="368" y="14" fill="#B9C2D6" font-size="10" font-family="sans-serif" text-anchor="end">도착 캠프</text>
      </svg>
      <div class="route-caption">
        <span>실시간 공고 등록</span>
        <span>기사 지원 · 매칭</span>
        <span>스케줄 자동 반영</span>
      </div>
    </div>

    <div class="brand-footer">
      <span>© 러너로지스</span>
      <span>용차 관리 시스템</span>
    </div>
  </div>

  <div class="form-panel">
    <div class="form-card">
      <h1>로그인</h1>
      <p class="desc">아이디와 비밀번호를 입력해 주세요.</p>

      <div class="role-toggle">
        <button type="button" class="active" data-role="기사">용차 기사</button>
        <button type="button" data-role="화주">일거리 등록(화주)</button>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="id">아이디</label>
          <input type="text" id="id" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">로그인</button>
      </form>

      <div class="msg" id="msgBox"></div>

      <div class="bottom-link">
        계정이 없으신가요? <a href="register.html">회원가입</a>
      </div>
    </div>
  </div>

<script>
  // ⚠️ Apps Script 웹앱 배포 후 나오는 URL로 반드시 교체하세요.
  const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

  let selectedRole = "기사";
  document.querySelectorAll(".role-toggle button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".role-toggle button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      selectedRole = btn.dataset.role;
    });
  });

  const form = document.getElementById("loginForm");
  const msgBox = document.getElementById("msgBox");
  const submitBtn = document.getElementById("submitBtn");

  function showMsg(text, type){
    msgBox.textContent = text;
    msgBox.className = "msg " + type;
  }

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const id = document.getElementById("id").value.trim();
    const password = document.getElementById("password").value;

    if(!id || !password){
      showMsg("아이디와 비밀번호를 입력하세요.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "로그인 중...";

    try{
      const res = await fetch(API_URL, {
        method:"POST",
        body: JSON.stringify({ action:"login", id, password })
      });
      const data = await res.json();

      if(data.ok){
        if(data.user.role !== selectedRole){
          showMsg("선택하신 유형(" + selectedRole + ")과 계정 유형(" + data.user.role + ")이 다릅니다.", "error");
        } else {
          sessionStorage.setItem("yongcha_user", JSON.stringify(data.user));
          showMsg("로그인 성공! 이동 중입니다...", "success");
          // TODO: 역할별 대시보드 페이지로 이동
          // window.location.href = data.user.role === "기사" ? "driver_dashboard.html" : "shipper_dashboard.html";
        }
      } else {
        showMsg(data.message || "로그인에 실패했습니다.", "error");
      }
    } catch(err){
      showMsg("서버와 통신 중 오류가 발생했습니다. API_URL 설정을 확인하세요.", "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "로그인";
    }
  });
</script>

</body>
</html>
