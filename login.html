<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1826">
<title>용차 매칭 | 로그인</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth">
  <div class="brand">
    <div>
      <div class="brand-eyebrow">용차 매칭</div>
      <h1 class="brand-title">용차가 필요한 날,<br>가장 빠르게<br>연결합니다</h1>
      <p class="brand-sub">용차일 등록부터 의뢰, 수락, 매칭 완료까지<br>하나의 앱에서 확인하세요.</p>
      <svg class="route-svg" viewBox="0 0 420 130" fill="none">
        <path d="M10 100 C 90 100, 90 30, 160 30 S 260 100, 340 100 S 400 40, 410 20" stroke="#3A4C74" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round"/>
        <circle cx="10" cy="100" r="5" fill="#E8A33D"/><circle cx="160" cy="30" r="4" fill="#8894AC"/>
        <circle cx="340" cy="100" r="4" fill="#8894AC"/><circle cx="410" cy="20" r="5" fill="#E8A33D"/>
      </svg>
      <div class="route-caption"><span>용차일 등록</span><span>의뢰 · 수락</span><span>매칭 완료</span></div>
    </div>
    <div class="brand-footer">© 러너로지스 · 용차 매칭</div>
  </div>

  <div class="form-panel">
    <div class="form-card">
      <h1>로그인</h1>
      <p class="desc">아이디와 비밀번호를 입력해 주세요.</p>
      <form id="loginForm">
        <div class="field">
          <label for="id">아이디</label>
          <input type="text" id="id" autocomplete="username" autocapitalize="none" required>
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">로그인</button>
      </form>
      <div class="msg" id="msgBox"></div>
      <div class="bottom-link">계정이 없으신가요? <a href="register.html">회원가입</a></div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
  if(getToken()) location.replace('home.html');

  const form = document.getElementById('loginForm');
  const msgBox = document.getElementById('msgBox');
  const btn = document.getElementById('submitBtn');

  function showMsg(t, type){ msgBox.textContent = t; msgBox.className = 'msg ' + type; }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const id = document.getElementById('id').value.trim();
    const password = document.getElementById('password').value;
    if(!id || !password){ showMsg('아이디와 비밀번호를 입력하세요.', 'error'); return; }

    btn.disabled = true; btn.textContent = '로그인 중...';
    try {
      const r = await api('login', { id: id, password: password });
      setSession(r.token, r.user);
      showMsg('로그인 성공! 이동 중입니다...', 'success');
      location.href = 'home.html';
    } catch(err){
      showMsg(err.message, 'error');
      btn.disabled = false; btn.textContent = '로그인';
    }
  });
</script>
</body>
</html>
