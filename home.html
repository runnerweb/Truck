<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1826">
<title>용차 매칭</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <div class="hello" id="hello">안녕하세요</div>
  <p class="hello-sub" id="helloSub"></p>

  <a class="big-btn" href="browse.html">
    <div class="bb-ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
    <div><div class="bb-t">용차일 보기</div><div class="bb-s">용차가 필요한 날짜를 확인하고 의뢰하세요</div></div>
  </a>

  <a class="big-btn accent" href="post.html">
    <div class="bb-ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M12 14v4M10 16h4"/></svg></div>
    <div><div class="bb-t">용차일 등록하기</div><div class="bb-s">용차가 필요한 날짜와 단가를 등록하세요</div></div>
  </a>

  <a class="big-btn light" href="schedule.html">
    <div class="bb-ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 15l2.5 2.5L16 13"/></svg></div>
    <div><div class="bb-t">내 스케줄</div><div class="bb-s">매칭 완료된 용차 일정과 기사 정보를 확인하세요</div></div>
  </a>

  <div class="card" style="margin-top:20px">
    <div class="small muted" style="margin-bottom:8px;font-weight:700">내 정보</div>
    <div class="detail-rows">
      <div class="jc-row"><b>캠프</b><span id="pCamp">-</span></div>
      <div class="jc-row"><b>라우트</b><span id="pRoute">-</span></div>
      <div class="jc-row"><b>캠프 위치</b><span id="pLoc">-</span></div>
    </div>
  </div>
</main>

<script src="common.js"></script>
<script>
  if(requireLogin()){
    renderAppbar({ title: '용차 매칭' });
    fill(getUser());
    api('me').then(function(r){ setSession(getToken(), r.user); setBadge(r.unread); fill(r.user); }).catch(function(e){ toast(e.message, 'err'); });
  }
  function fill(u){
    if(!u) return;
    document.getElementById('hello').textContent = u.name + '님, 안녕하세요';
    document.getElementById('helloSub').textContent = '@' + u.id;
    document.getElementById('pCamp').textContent = u.camp || '-';
    document.getElementById('pRoute').textContent = u.route || '-';
    document.getElementById('pLoc').textContent = u.campLoc || '-';
  }
</script>
</body>
</html>
